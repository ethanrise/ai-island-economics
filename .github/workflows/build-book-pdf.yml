name: Build V0.1 Book Files

on:
  push:
    branches: [main]
    paths:
      - 'chapters/**'
      - 'book-pages/**'
      - 'tools/book/**'
      - '.github/workflows/build-book-pdf.yml'
  pull_request:
    branches: [main]
    paths:
      - 'chapters/**'
      - 'book-pages/**'
      - 'tools/book/**'
      - '.github/workflows/build-book-pdf.yml'
      - 'release/v0.1/build-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install book dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk libpango-1.0-0 libpangoft2-1.0-0
          python -m pip install --upgrade pip
          pip install markdown weasyprint

      - name: Build PDF
        run: python tools/book/build_pdf.py

      - name: Build EPUB
        run: python tools/book/build_epub.py

      - name: Upload book artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-island-economics-v0.1
          path: |
            release/v0.1/AI时代的小岛经济学-V0.1.pdf
            release/v0.1/AI时代的小岛经济学-V0.1.epub
          if-no-files-found: error

      - name: Commit generated book files
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'release/v0.1/AI时代的小岛经济学-V0.1.pdf' 'release/v0.1/AI时代的小岛经济学-V0.1.epub'
          if git diff --cached --quiet; then
            echo 'Book files unchanged'
          else
            git commit -m 'Build V0.1 PDF and EPUB'
            git push
          fi
